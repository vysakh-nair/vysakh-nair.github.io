    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]).then(function (key) {

      return crypto.subtle.deriveBits({ name: "PBKDF2", salt: bytes(P.s), iterations: P.n, hash: "SHA-256" }, base, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }
  if (!window.crypto || !crypto.subtle) { reveal(); say("This browser can't unlock the page here. Try a current browser."); go.disabled = true; return; }

  show.addEventListener("click", function () {
    var on = input.type === "password";
    input.type = on ? "text" : "password"; show.textContent = on ? "Hide" : "Show"; show.setAttribute("aria-pressed", on ? "true" : "false");
    input.focus();
  });
  input.addEventListener("input", function () { if (input.getAttribute("aria-invalid")) { input.removeAttribute("aria-invalid"); msg.textContent = ""; } });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    var pw = input.value.normalize("NFC").trim();
    if (!pw) { wrong("Enter the password."); return; }

    derive(pw).then(function (r) { raw = r; return unwrap(r); }).then(function (page) {

      try { sessionStorage.setItem(P.k, b64(raw)); kept = sessionStorage.getItem(P.k) === b64(raw); } catch (err) {}

      if (kept) { root.classList.add("lock-wait"); location.reload(); } else open(page);
    }).catch(function () { wrong("That password didn't work. Check it and try again."); });
  });

  // already unlocked in this tab: open without asking
  var kept = null;
  try { kept = sessionStorage.getItem(P.k); } catch (err) {}
  if (kept) unwrap(bytes(kept)).then(open).catch(function () { try { sessionStorage.removeItem(P.k); } catch (err) {} reveal(); });
  else reveal();
})();
</script>
