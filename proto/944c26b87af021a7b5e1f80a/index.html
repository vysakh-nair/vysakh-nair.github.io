<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airstack Explorer (clickable prototype)</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="proto.css">
</head>
<body>
<div class="stage" id="stage">
  <div class="canvas" id="canvas">
    <div class="scroll" id="scroll" tabindex="0" role="group" aria-label="Airstack Explorer screen. Scroll to see more.">
      <div class="page" id="page">
        <img class="shot" alt="">
        <div class="layer" id="hots"></div>
      </div>
    </div>
  </div>
  <div class="ctl" role="group" aria-label="Prototype controls">
    <button type="button" id="back">Back</button>
    <button type="button" id="reset">Start over</button>
  </div>
</div>
<p class="sr" id="say" aria-live="polite"></p>
<script src="states.js"></script>
<script src="proto.js"></script>
</body>
</html>
